<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KV 配置中心 | 企业级配置管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            transition: background 0.3s, color 0.2s;
            min-height: 100vh;
        }
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
            --sidebar-bg: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: 1px solid rgba(255, 255, 255, 0.5);
            --shadow: 0 8px 32px rgba(0,0,0,0.05);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border-light: #e2e8f0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --table-header: #f8fafc;
            --code-bg: #f1f5f9;
            --sidebar-width: 260px;
            --header-height: 64px;
        }
        body.dark {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --sidebar-bg: rgba(30, 41, 59, 0.8);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: 1px solid rgba(71, 85, 105, 0.5);
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-light: #334155;
            --table-header: #1e293b;
            --code-bg: #0f172a;
        }
        /* 布局 */
        .app-container { display: flex; min-height: 100vh; }
        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-light);
            padding: 1.5rem 1rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent);
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .nav-item.active, .nav-item:hover {
            background: var(--accent);
            color: white;
        }
        /* 顶部栏 */
        .top-bar {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            padding: 0 1.5rem;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            z-index: 10;
        }
        .theme-btn {
            background: var(--code-bg);
            border: none;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        /* 主内容区 */
        .main-content {
            flex: 1;
            max-width: calc(100% - var(--sidebar-width));
        }
        .content-wrapper {
            padding: 1.5rem 2rem;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: var(--card-border);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); }
        .btn-outline:hover { background: var(--code-bg); }
        input, textarea {
            width: 100%;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            padding: 0.75rem 1rem;
            font-family: monospace;
            color: var(--text-primary);
        }
        .json-editor-container { height: 280px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-light); }
        .table-wrapper { overflow-x: auto; border-radius: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; vertical-align: middle; border-bottom: none;}
        th { background: var(--table-header); }
        .json-viewer { background: var(--code-bg); padding: 0.5rem; border-radius: 12px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; max-width: 450px; }
        .action-icons { display: flex; gap: 0.8rem; align-items: center; }
        .action-icons i { font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); }
        .action-icons i:hover { color: var(--accent); }
        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .modal-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: var(--card-border);
            padding: 1.8rem;
            min-width: 300px;
            text-align: center;
        }
        .modal-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; }
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 40px; padding: 0.7rem 1.3rem;
            border-left: 4px solid var(--success);
            z-index: 1000;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { max-width: 100%; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header"><i class="fas fa-database"></i> KV 配置中心</div>
        <div class="nav-item active" data-view="configs"><i class="fas fa-cog"></i> 配置管理</div>
        <div class="nav-item" data-view="apikeys"><i class="fas fa-key"></i> API 密钥</div>
        <div class="nav-item" data-view="logs"><i class="fas fa-history"></i> 操作日志</div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <button id="themeToggleBtn" class="theme-btn"><i class="fas fa-moon"></i> 暗色模式</button>
        </div>
        <div class="content-wrapper">
            <!-- 配置管理视图 -->
            <div id="configView">
                <div class="glass-card">
                    <h2><i class="fas fa-pen-alt"></i> 新建 / 编辑配置</h2>
                    <div class="form-group"><label>配置键名 (Key)</label><input type="text" id="configKey" placeholder="例如: app_settings"></div>
                    <div class="form-group"><label>配置值 (JSON)</label><div id="jsonEditorContainer" class="json-editor-container"></div></div>
                    <div style="display: flex; gap: 0.8rem; flex-wrap: wrap;">
                        <button id="formatJsonBtn" class="btn btn-outline"><i class="fas fa-magic"></i> 格式化</button>
                        <button id="validateJsonBtn" class="btn btn-outline"><i class="fas fa-check-circle"></i> 校验</button>
                        <button id="saveConfigBtn" class="btn btn-primary"><i class="fas fa-save"></i> 保存</button>
                        <button id="clearFormBtn" class="btn btn-outline"><i class="fas fa-eraser"></i> 清空</button>
                    </div>
                </div>
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center;"><h2><i class="fas fa-list-ul"></i> 配置列表</h2><button id="refreshListBtn" class="btn btn-outline"><i class="fas fa-sync-alt"></i> 刷新</button></div>
                    <div class="table-wrapper"><table><thead><tr><th>Key</th><th>Value</th><th>操作</th></tr></thead><tbody id="configTableBody"><tr><td colspan="3">加载中...</td></tr></tbody></table></div>
                </div>
            </div>
            <!-- API 密钥视图 -->
            <div id="apikeysView" style="display:none;">
                <div class="glass-card">
                    <h2><i class="fas fa-key"></i> API 密钥管理</h2>
                    <p>用于调用 Worker API 的 Bearer Token。请妥善保管。</p>
                    <div class="form-group"><label>当前 Token</label><input type="text" id="apiTokenInput" readonly style="background: var(--code-bg);"></div>
                    <div style="display: flex; gap: 1rem;">
                        <button id="copyTokenBtn" class="btn btn-outline"><i class="fas fa-copy"></i> 复制 Token</button>
                        <button id="generateNewTokenBtn" class="btn btn-primary"><i class="fas fa-sync-alt"></i> 生成新 Token</button>
                    </div>
                </div>
            </div>
            <!-- 操作日志视图 -->
            <div id="logsView" style="display:none;">
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between;"><h2><i class="fas fa-history"></i> 操作日志</h2><button id="refreshLogsBtn" class="btn btn-outline"><i class="fas fa-sync-alt"></i> 刷新</button></div>
                    <div class="table-wrapper"><table><thead><tr><th>时间</th><th>操作</th><th>Key</th><th>结果</th></tr></thead><tbody id="logsTableBody"><tr><td colspan="4">加载中...</td></tr></tbody></table></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
    // ==================== 配置 ====================
    const WORKER_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8787'
        : 'https://cloudflare-config-platform.964057117.workers.dev';   // 部署时替换
    let API_TOKEN = localStorage.getItem('api_token') || '';
    let monacoEditor = null;
    let currentTheme = localStorage.getItem('theme') || 'light';

    // ==================== 工具函数 ====================
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        toast.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function customConfirm(msg) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-container"><i class="fas fa-question-circle" style="font-size:2rem;color:var(--accent);"></i><p>${msg}</p><div class="modal-buttons"><button class="btn btn-outline" id="modalCancel">取消</button><button class="btn btn-primary" id="modalConfirm">确认</button></div></div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#modalConfirm').onclick = () => { overlay.remove(); resolve(true); };
            overlay.querySelector('#modalCancel').onclick = () => { overlay.remove(); resolve(false); };
        });
    }

    function customAlert(msg) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-container"><i class="fas fa-info-circle" style="font-size:2rem;color:var(--accent);"></i><p>${msg}</p><div class="modal-buttons"><button class="btn btn-primary" id="modalOk">确定</button></div></div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#modalOk').onclick = () => { overlay.remove(); resolve(); };
        });
    }

    async function apiRequest(path, options = {}) {
        const url = `${WORKER_URL}${path}`;
        const headers = {
            'Content-Type': 'application/json',
            ...(API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {}),
            ...options.headers,
        };
        const res = await fetch(url, { ...options, headers });
        if (!res.ok) {
            if (res.status === 401) {
                await customAlert('认证失败，请检查 API Token 是否正确。');
                // 跳转到密钥管理视图
                switchView('apikeys');
                throw new Error('Unauthorized');
            }
            throw new Error(`HTTP ${res.status}`);
        }
        return res.json();
    }

    // ==================== 主题切换 ====================
    function setTheme(theme) {
        currentTheme = theme;
        if (theme === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i> 亮色模式';
            if (monacoEditor) monaco.editor.setTheme('vs-dark');
        } else {
            document.body.classList.remove('dark');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-moon"></i> 暗色模式';
            if (monacoEditor) monaco.editor.setTheme('vs');
        }
        localStorage.setItem('theme', theme);
    }
    function toggleTheme() { setTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

    // ==================== 配置管理 ====================
    async function loadConfigs() {
        const tbody = document.getElementById('configTableBody');
        tbody.innerHTML = '<tr><td colspan="3">加载中...</td></tr>';
        try {
            const data = await apiRequest('/api/config/list');
            const items = data.data || {};
            const keys = Object.keys(items);
            if (keys.length === 0) { tbody.innerHTML = '<tr><td colspan="3">暂无配置</td></tr>'; return; }
            let html = '';
            for (const key of keys) {
                const val = items[key];
                html += `<tr><td>${escapeHtml(key)}</td><td><div class="json-viewer">${syntaxHighlight(val)}</div></td><td class="action-icons">
                    <i class="fas fa-edit" data-key="${escapeHtml(key)}" data-value='${JSON.stringify(val).replace(/'/g, "&#39;")}'></i>
                    <i class="fas fa-trash-alt" data-key="${escapeHtml(key)}"></i>
                    <i class="fas fa-copy" data-key="${escapeHtml(key)}"></i>
                </td></tr>`;
            }
            tbody.innerHTML = html;
            // 绑定事件
            tbody.querySelectorAll('.fa-edit').forEach(btn => {
                btn.onclick = () => editConfig(btn.dataset.key, JSON.parse(btn.dataset.value));
            });
            tbody.querySelectorAll('.fa-trash-alt').forEach(btn => {
                btn.onclick = async () => { if (await customConfirm(`删除配置 "${btn.dataset.key}"？`)) await deleteConfig(btn.dataset.key); };
            });
            tbody.querySelectorAll('.fa-copy').forEach(btn => {
                btn.onclick = () => { navigator.clipboard.writeText(btn.dataset.key); showToast(`已复制 Key: ${btn.dataset.key}`); };
            });
        } catch(e) { tbody.innerHTML = `<tr><td colspan="3">加载失败: ${e.message}</td></tr>`; }
    }

    async function saveConfig() {
        const key = document.getElementById('configKey').value.trim();
        if (!key) { showToast('请输入 Key', true); return; }
        let raw = monacoEditor.getValue();
        let parsed;
        try { parsed = JSON.parse(raw); } catch(e) { showToast('JSON 无效', true); return; }
        try {
            await apiRequest(`/api/config/${encodeURIComponent(key)}`, { method: 'POST', body: JSON.stringify({ value: parsed }) });
            showToast(`保存成功: ${key}`);
            document.getElementById('configKey').value = '';
            monacoEditor.setValue('{}');
            loadConfigs();
            if (currentView === 'logs') loadLogs(); // 日志视图也会刷新
        } catch(e) { showToast('保存失败: '+e.message, true); }
    }

    async function deleteConfig(key) {
        try {
            await apiRequest(`/api/config/${encodeURIComponent(key)}`, { method: 'DELETE' });
            showToast(`已删除: ${key}`);
            loadConfigs();
            if (currentView === 'logs') loadLogs();
        } catch(e) { showToast('删除失败', true); }
    }

    function editConfig(key, value) {
        document.getElementById('configKey').value = key;
        monacoEditor.setValue(JSON.stringify(value, null, 2));
        document.querySelector('.glass-card').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() { document.getElementById('configKey').value = ''; monacoEditor.setValue('{}'); showToast('已清空'); }
    function formatJson() { try { const val = JSON.parse(monacoEditor.getValue()); monacoEditor.setValue(JSON.stringify(val, null, 2)); showToast('格式化完成'); } catch(e) { showToast('无效 JSON', true); } }
    function validateJson() { try { JSON.parse(monacoEditor.getValue()); showToast('JSON 有效'); } catch(e) { showToast('无效 JSON', true); } }

    // ==================== API 密钥管理 ====================
    async function loadApiToken() {
        try {
            // 如果没有本地 Token，先尝试获取一个（需管理员 API_TOKEN，但前端无法得到，所以提供一个初始化接口）
            if (!API_TOKEN) {
                // 提示用户手动输入？或者利用 Worker 公开接口生成，但需管理员授权。我们提供一种简单方式：如果无 Token，弹框让用户输入
                const userToken = localStorage.getItem('api_token');
                if (userToken) API_TOKEN = userToken;
                else {
                    // 第一次使用，需要用户从后台获取（例如管理员提供）
                    const inputToken = await promptForToken();
                    if (inputToken) {
                        API_TOKEN = inputToken;
                        localStorage.setItem('api_token', API_TOKEN);
                    } else {
                        document.getElementById('apiTokenInput').value = '未设置，请点击“生成新 Token”或联系管理员';
                        return;
                    }
                }
            }
            // 尝试获取当前 Token（通过 Worker 的 /api/user/token GET 需要管理员权限，这里简化：直接展示本地保存的）
            document.getElementById('apiTokenInput').value = API_TOKEN;
        } catch(e) { console.error(e); }
    }

    async function generateNewToken() {
        const confirm = await customConfirm('生成新 Token 会使旧 Token 失效，确定吗？');
        if (!confirm) return;
        try {
            const res = await apiRequest('/api/user/token', { method: 'POST' });
            const newToken = res.token;
            API_TOKEN = newToken;
            localStorage.setItem('api_token', newToken);
            document.getElementById('apiTokenInput').value = newToken;
            showToast('新 Token 已生成，请复制保存');
        } catch(e) { showToast('生成失败: '+e.message, true); }
    }

    function copyToken() {
        const input = document.getElementById('apiTokenInput');
        if (input.value && input.value !== '未设置...') {
            navigator.clipboard.writeText(input.value);
            showToast('已复制 Token');
        } else { showToast('无 Token 可复制', true); }
    }

    async function promptForToken() {
        // 弹出自定义输入框
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-container"><p>请输入您的 API Token</p><input type="text" id="tokenInput" style="width:100%;margin-top:1rem;"><div class="modal-buttons"><button class="btn btn-outline" id="cancelBtn">取消</button><button class="btn btn-primary" id="confirmBtn">确认</button></div></div>`;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#tokenInput');
            overlay.querySelector('#confirmBtn').onclick = () => { const val = input.value.trim(); overlay.remove(); resolve(val); };
            overlay.querySelector('#cancelBtn').onclick = () => { overlay.remove(); resolve(null); };
        });
    }

    // ==================== 操作日志 ====================
    async function loadLogs() {
        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = '<tr><td colspan="4">加载中...</td></tr>';
        try {
            const res = await apiRequest('/api/logs/list');
            const logs = res.logs || [];
            if (logs.length === 0) { tbody.innerHTML = '<tr><td colspan="4">暂无操作记录</td></tr>'; return; }
            let html = '';
            for (const log of logs) {
                html += `<tr><td>${new Date(log.timestamp).toLocaleString()}</td><td>${log.operation}</td><td>${escapeHtml(log.key)}</td><td>${log.result}</td></tr>`;
            }
            tbody.innerHTML = html;
        } catch(e) { tbody.innerHTML = `<tr><td colspan="4">加载失败: ${e.message}</td></tr>`; }
    }

    // ==================== 导航切换 ====================
    let currentView = 'configs';
    function switchView(view) {
        currentView = view;
        document.getElementById('configView').style.display = view === 'configs' ? 'block' : 'none';
        document.getElementById('apikeysView').style.display = view === 'apikeys' ? 'block' : 'none';
        document.getElementById('logsView').style.display = view === 'logs' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.dataset.view === view) item.classList.add('active');
            else item.classList.remove('active');
        });
        if (view === 'configs') loadConfigs();
        else if (view === 'apikeys') loadApiToken();
        else if (view === 'logs') loadLogs();
    }

    // ==================== 初始化 ====================
    function syntaxHighlight(obj) {
        let str = JSON.stringify(obj, null, 2);
        str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (m) {
            if (/^"/.test(m)) return /:$/.test(m) ? `<span style="color:#7ee787;">${m}</span>` : `<span style="color:#a5d6ff;">${m}</span>`;
            if (/true|false/.test(m)) return `<span style="color:#ff7b72;">${m}</span>`;
            if (/null/.test(m)) return `<span style="color:#ff7b72;">${m}</span>`;
            return `<span style="color:#79c0ff;">${m}</span>`;
        });
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }

    // Monaco 加载
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
        monacoEditor = monaco.editor.create(document.getElementById('jsonEditorContainer'), {
            value: '{}', language: 'json', theme: currentTheme === 'dark' ? 'vs-dark' : 'vs',
            automaticLayout: true, fontSize: 13, minimap: { enabled: false }, lineNumbers: 'on'
        });
    });

    // 绑定事件
    document.getElementById('themeToggleBtn').onclick = toggleTheme;
    document.getElementById('saveConfigBtn').onclick = saveConfig;
    document.getElementById('clearFormBtn').onclick = clearForm;
    document.getElementById('refreshListBtn').onclick = loadConfigs;
    document.getElementById('formatJsonBtn').onclick = formatJson;
    document.getElementById('validateJsonBtn').onclick = validateJson;
    document.getElementById('copyTokenBtn').onclick = copyToken;
    document.getElementById('generateNewTokenBtn').onclick = generateNewToken;
    document.getElementById('refreshLogsBtn').onclick = loadLogs;
    document.querySelectorAll('.nav-item').forEach(item => { item.onclick = () => switchView(item.dataset.view); });

    setTheme(currentTheme);
    switchView('configs');
    // 尝试从 localStorage 恢复 Token
    const storedToken = localStorage.getItem('api_token');
    if (storedToken) API_TOKEN = storedToken;
</script>
</body>
